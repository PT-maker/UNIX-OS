global
    maxconn 256

defaults
    mode http
    timeout connect 3s
    timeout client 30s
    timeout server 30s

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s

frontend fe
    bind *:80
    default_backend api

backend api
    balance roundrobin
    server-template api 10 api:5000 check resolvers docker init-addr libc,none
