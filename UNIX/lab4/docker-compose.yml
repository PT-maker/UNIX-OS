services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  api:
    build: ./app
    command: python api.py
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: ./app
    command: python worker.py
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy

  haproxy:
    image: haproxy:2.9-alpine
    ports:
      - "8080:80"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - api